name: Build My Scooty Android 16 ARM64 PL

on:
  push:
    branches:
      - android16-arm64
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Android SDK 36 + NDK ARM64
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Testy parsera BLE
        run: gradle testDebugUnitTest --stacktrace

      - name: Budowanie APK debug + release
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Weryfikacja ARM64
        shell: bash
        run: |
          set -e
          APK="$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmyscooty_native.so"
          echo "Potwierdzono bibliotekę ARM64-v8a w $APK"

      - name: Publikuj APK
        uses: actions/upload-artifact@v4
        with:
          name: MyScooty-Android16-ARM64-PL
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 21
